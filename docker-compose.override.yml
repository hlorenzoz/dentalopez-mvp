services:
  backend:
    environment:
      YII_DEBUG: "true"
      PHP_IDE_CONFIG: "serverName=dentalopez"
    volumes:
      - ./backend:/app
      - uploads_data:/uploads
    command: php-fpm

  mcp:
    build:
      context: ./mcp
      target: dev
    volumes:
      - ./mcp:/app
      - /app/node_modules
      - uploads_data:/uploads
    environment:
      NODE_ENV: development
      PORT: "3001"
    command: npx tsx watch src/index.ts
    ports: ["3001:3001"]

  frontend:
    build:
      context: ./frontend
      target: dev
    image: mvp-frontend-dev
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/next.config.mjs:/app/next.config.mjs:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs:ro
      - /app/.next
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    ports: ["3000:3000"]
