services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./backend/public:/app/public:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend, mcp]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      YII_ENV: prod
      YII_DEBUG: "false"
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MCP_URL: http://mcp:3001
    volumes:
      - uploads_data:/uploads
    depends_on: [db]

  mcp:
    build: ./mcp
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_TO: ${RESEND_TO}
      RESEND_CC: ${RESEND_CC:-}
      RESEND_DRY_RUN: ${RESEND_DRY_RUN:-false}
      BACKEND_URL: http://backend
    volumes:
      - uploads_data:/uploads
    depends_on: [backend]

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://caddy
      NEXT_PUBLIC_BACKEND_URL: http://localhost

  db:
    image: mariadb:lts
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes: [db_data:/var/lib/mysql]

volumes:
  caddy_data:
  caddy_config:
  db_data:
  uploads_data:
